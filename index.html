<script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d'),panel=$('.panel'),overlay=$('.overlay'),pad=$('.pad');
const WORLD=12000, FLOOR=18000;
const levels=[0,60,160,340,600,950,1350];
const zones=['산호 여울','다시마 숲','상어 협곡','고래 회랑','푸른 황혼대','발광 심해','고대 해구'];
// name, health, coins, score, contact damage, speed, silhouette, color, body radius
const kinds=[
 ['청줄돔',10,5,10,0,32,'reef','#69e0d3',12],['나비고기',15,7,16,0,29,'stripe','#ffc45f',15],
 ['쥐치',23,9,24,0,32,'reef','#9acd78',16],['꼬치고기',32,14,40,9,56,'pike','#99c3b9',20],
 ['청상아리',62,25,85,17,66,'shark','#74a7b5',35],['황다랑어',38,16,50,0,52,'pike','#e5c06d',23],
 ['초롱아귀',95,39,150,23,68,'angler','#9170ab',27],['향유고래',270,100,480,0,36,'sperm','#8394a9',104],
 ['흰동가리',12,6,13,0,35,'clown','#ff9555',12],['정어리',9,4,9,0,50,'silver','#b3e9e2',10],
 ['노랑가오리',28,12,32,0,34,'ray','#c7aa70',24],['고래상어',165,60,235,0,33,'spotted','#608e9b',69],
 ['귀상어',75,31,106,19,72,'hammer','#799b9f',40],['백상아리',130,60,225,28,79,'white','#9fabb2',53],
 ['혹등고래',245,86,395,0,36,'hump','#729cad',92],['흰긴수염고래',550,180,990,0,32,'blue','#689cb8',164],
 ['범고래',180,84,355,25,85,'orca','#32435a',64],['산갈치',110,48,188,0,44,'ribbon','#b1a4c2',58],
 ['독사고기',120,55,215,24,86,'fang','#86769a',30],['대왕오징어',230,105,460,29,75,'squid','#ba747e',58],
 ['심해 해파리',80,32,110,0,23,'jelly','#93a2ef',28],['메갈로돈',860,450,50000,40,77,'mega','#6a788b',116]
];
const bands=[[0,1,8,9],[2,3,9,10],[4,5,10,11,12],[5,11,13,14,16],[7,14,16,17],[6,17,18,19,20],[6,18,19,20]];
const giants=[{id:15,x:2200,y:4450,w:1000,h:240},{id:21,x:6000,y:15800,w:680,h:380},
 {id:21,x:5800,y:16600,w:650,h:300},
 {id:21,x:1900,y:17300,w:600,h:260},
 {id:21,x:8350,y:17700,w:600,h:200}];
const megalodonHomes=giants.filter(g=>g.id===21);
let cx=0,giantsSeen,giantsCaught,megalodonReturnAt=null;
const gearNames=['작살 발사기','잠수 갑옷','오리발','멀티킬','회복 포션','관통공격','범위공격'],price=[38,36,30];
let W=800,H=500,cam=0,mode='intro',player,fish,bolts,flashes,clock=0,spawn=0,fire=0,hurt=0,msgUntil=0,bag=[],lastQ='',best=0;
try{best=Number(localStorage.getItem('ocean-hunt-best-v1'))||0}catch{}
const keys=new Set();let stick={x:0,y:0},finger=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),zone=y=>levels.reduce((n,m,i)=>y>=m*10?i:n,0);
const GOAL=500000;
const weaponName=lv=>lv<5?'작살 발사기':lv<11?'수중 펄스총':'추적 미사일';
function duration(seconds){return Math.floor(seconds/60)+'분 '+String(seconds%60).padStart(2,'0')+'초'}
const gates=[0,5000,22000], stageNames=['산호 탐사','거친 조류','최후의 해구'];
function stageFor(score){return score>=gates[2]?3:score>=gates[1]?2:1}
function fishHealth(id,y,stage){
 const depth=zone(y);
 return Math.ceil(kinds[id][1]*(1+Math.max(0,depth-1)*.28)*(1+(stage-1)*.52));
}
function advance(){
 const target=stageFor(player.score);
 if(target===player.stage)return;
 player.stage=target;
 for(const f of fish){
 const max=fishHealth(f.id,f.base,target);
 f.hp=Math.ceil(max*f.hp/f.maxhp);f.maxhp=max;
 }
 screen('transition','<h2>스테이지 '+target+' · '+stageNames[target-1]+'</h2><p>장비와 점수를 이어갑니다. 포식자가 더 멀리서 다가오고 공격도 강해집니다.</p><p>'+(target===3?'누적 500,000점에 도달하면 탐사를 클리어합니다.':'누적 22,000점에 최후의 해구가 열립니다.')+'</p>');
 button('잠수 계속',()=>screen('play'),true);
}
function bossPosition(g){return fish.find(f=>f.home===g)||g}
function sonar(p){
 if(p.y<13500)return '';
 let closest=Infinity,angle=0;
 for(const g of giants){
  if(g.id!==21||giantsCaught.has(g))continue;
  const f=bossPosition(g),dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);
  if(d<closest){closest=d;angle=Math.atan2(dy,dx)}
 }
 if(!Number.isFinite(closest))return '메갈로돈 재등장까지 '+Math.max(0,Math.ceil(megalodonReturnAt-clock))+'초';
 return '메갈로돈 '+['→','↘','↓','↙','←','↖','↑','↗'][(Math.round(angle/(Math.PI/4))+8)%8]+' '+Math.round(closest/10)+' m';
}
function hud(){
 const p=player;$('#sonar').textContent=sonar(p);$('#depth').textContent='S'+p.stage+' · '+Math.floor(p.y/10)+' m · '+zones[zone(p.y)]+' · '+(p.x<WORLD/3?'서쪽':p.x>WORLD*2/3?'동쪽':'중앙');$('#life').textContent='체력 '+Math.ceil(p.hp)+' / '+p.maxhp;$('.hp i').style.width=p.hp/p.maxhp*100+'%';$('#score').textContent=p.score;$('#cash').textContent=p.coins;
 $('#gear').textContent=weaponName(p.lv[0])+' '+(1+p.lv[0])+'단계　갑옷 '+(1+p.lv[1])+'단계　오리발 '+(1+p.lv[2])+'단계　멀티킬 '+(1+p.lv[3])+'단계　'+(p.lv[5]?'관통 장착　':'')+'범위 '+(p.lv[6]+1)+'단계　·　사냥 '+p.kills+'마리　·　'+(p.stage===3?'클리어 목표 500,000점':('다음 스테이지 '+gates[p.stage].toLocaleString()+'점'));
}
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const k=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*k);canvas.height=Math.round(H*k);ctx.setTransform(k,0,0,k,0,0);if(player)camera()}
function addFish(id,x,y){const hp=fishHealth(id,y,player.stage);fish.push({id,x,y,hp,maxhp:hp,dir:Math.random()<.5?-1:1,phase:rand(0,6),base:y})}
function camera(){cx=clamp(player.x-W/2,0,WORLD-W);cam=clamp(player.y-H*.44,0,FLOOR+55-H)}
function fresh(admin=false){player={admin,invincible:false,activeMs:0,started:null,stage:1,run:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),x:WORLD/2,y:115,hp:100,maxhp:100,coins:admin?500000:0,score:0,kills:0,lv:[0,0,0,0,0,0,0],face:1};fish=[];bolts=[];flashes=[];giantsSeen=new Set();giantsCaught=new Set();megalodonReturnAt=null;syncShield();camera();clock=spawn=fire=hurt=0;bag=[];lastQ='';$('#toast').textContent='';for(let i=0;i<95;i++)addFish(bands[0][i%4],cx+rand(22,W-22),rand(48,Math.min(490,H)));addFish(0,player.x+90,player.y+10);hud()}
function habitat(f){return f.home}
function spawnGiant(home){
 addFish(home.id,home.x,home.y);
 fish.at(-1).home=home;
 giantsSeen.add(home);
}
function recordGiantCatch(home){
 giantsCaught.add(home);
 if(home.id===21&&megalodonReturnAt===null&&megalodonHomes.every(g=>giantsCaught.has(g))){
  megalodonReturnAt=clock+5;
 }
}
function respawnMegalodons(){
 if(megalodonReturnAt===null||clock<megalodonReturnAt)return;
 megalodonReturnAt=null;
 for(const home of megalodonHomes){
  giantsCaught.delete(home);
  spawnGiant(home);
 }
 notify('메갈로돈 4마리가 다시 나타났습니다!');
}
function populate(){
 const p=player;
 fish=fish.filter(f=>habitat(f)||Math.abs(f.x-p.x)<W*.9+140&&Math.abs(f.y-p.y)<H+170||bolts.some(b=>b.f===f));
 for(const g of giants){
  if(!giantsSeen.has(g)&&Math.abs(p.x-g.x)<W*.6+g.w&&Math.abs(p.y-g.y)<H*.6+g.h){
   spawnGiant(g);notify(kinds[g.id][0]+' 출현!');
  }
 }
 const missing=136+24*(p.stage-1)-fish.filter(f=>!f.home).length;
 for(let i=0;i<Math.min(12,missing);i++){
 const y=clamp(p.y+rand(-H*.55,H*.65),35,FLOOR-25);
 let ids=bands[zone(y)];
 if(ids.some(id=>kinds[id][4])&&Math.random()<.12*p.stage)ids=ids.filter(id=>kinds[id][4]);
 const id=ids[Math.floor(Math.random()*ids.length)];
 let x=clamp(p.x+(Math.random()<.5?-1:1)*rand(W*.35,W*.62),25,WORLD-25);
 if(Math.abs(x-p.x)<85)x=clamp(p.x+(p.x<WORLD/2?1:-1)*W*.44,25,WORLD-25);
 addFish(id,x,y);
 }
}
function chart(){
 screen('map','<h2>잠수 해도</h2><p>현재 위치와 대형 생물의 서식지를 확인하세요.</p><canvas id="mapCanvas" style="width:100%;height:auto;background:#103449;border-radius:10px"></canvas><p>◆ 서쪽 220 m · 수심 445 m  흰긴수염고래<br>▲ 메갈로돈 서식지 4곳 · 수심 1,580~1,770 m<br>이번 무리에서 사냥한 메갈로돈 '+megalodonHomes.filter(g=>giantsCaught.has(g)).length+' / 4마리<br>현재 가로 위치 '+Math.round(player.x/10)+' / 1,200 m</p>');
 const c=$('#mapCanvas');c.width=420;c.height=205;const a=c.getContext('2d');
 levels.forEach((m,i)=>{const y=m/1800*205;a.fillStyle=['#318d91','#267b80','#216576','#1b5368','#18435b','#18364d','#142b40'][i];a.fillRect(0,y,420,205-y);a.fillStyle='#e3f5f3';a.font='11px sans-serif';if(i>0)a.fillText(m+' m',5,y+12)});
 giants.forEach(g=>{const pos=bossPosition(g);a.fillStyle='#ffd383';a.font='bold 17px sans-serif';a.fillText(giantsCaught.has(g)?'✓':g.id===15?'◆':'▲',pos.x/WORLD*420-7,pos.y/FLOOR*205+6)});
 a.beginPath();a.arc(clamp(player.x/WORLD*420,4,416),clamp(player.y/FLOOR*205,4,201),4,0,Math.PI*2);a.fillStyle='white';a.fill();button('잠수 계속',()=>screen('play'),true)
}
function clearInput(){keys.clear();stick={x:0,y:0};finger=null;$('.knob').style.transform='none'}
function screen(m,markup=''){
 if(player.started!==null){player.activeMs+=performance.now()-player.started;player.started=null}
 if(m==='play')player.started=performance.now();
 mode=m;clearInput();document.body.classList.toggle('play',m==='play');overlay.hidden=m==='play';panel.innerHTML=markup;if(!overlay.hidden){panel.scrollTop=0;panel.focus({preventScroll:true})}}
function button(label,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=fn;panel.append(b);return b}
function intro(){screen('intro','<h2 class="big">해저 사냥일지(공통수학2-2)</h2><p>1,800 m 바다에서 장비를 강화하세요. 누적 5,000점에 2스테이지, 22,000점에 최후의 해구가 열립니다. 해도를 열면 서쪽 고래 회랑과 깊은 해구의 메갈로돈 서식지를 찾을 수 있습니다.</p>');button('잠수 시작 →',()=>{fresh();screen('play')},true);button('목표 & 규칙',rules);button('랭킹 기록실',()=>ranking(intro));button('관리자 모드',adminLogin)}
function adminLogin(){
 screen('adminLogin','<h2>관리자 모드</h2><p>50만 골드로 시작합니다. 관리자 잠수는 랭킹에서 제외됩니다.</p><label for="adminCode">관리자 코드</label><input id="adminCode" type="password" inputmode="numeric" autocomplete="off" style="width:100%;padding:9px;margin:5px 0 10px">');
 const input=$('#adminCode');
 function enter(){
  if(mode!=='adminLogin')return;
  const code=input.value.normalize('NFKC').trim();input.value='';
  if(/^[0-9]{6}$/.test(code)&&btoa(code)==='OTUxMjE1'){
   fresh(true);screen('play');return;
  }
  screen('adminError','<h2>관리자 모드</h2><p role="alert">코드가 올바르지 않습니다.</p>');
  button('시작 화면으로',intro,true);
 }
 button('관리자 잠수 시작',enter,true);
 button('시작 화면으로',intro);
 input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();enter()}};
 input.focus();
}
function syncShield(){
 const b=$('#shield');b.hidden=!player.admin;
 b.textContent=player.invincible?'무적 ON':'무적 OFF';
 b.setAttribute('aria-pressed',String(player.invincible));

const historyKey='ocean-expeditions-v3';
let records=[];
try{records=JSON.parse(localStorage.getItem(historyKey)||'[]');if(!Array.isArray(records))records=[]}catch{}
function saveRecords(){try{localStorage.setItem(historyKey,JSON.stringify(records));return true}catch{return false}}
function remember(){
 if(player.admin||records.some(r=>r.id===player.run))return;
 records.unshift({id:player.run,date:Date.now(),name:'잠수부',score:player.score,kills:player.kills,stage:player.stage,result:player.result,seconds:player.result==='클리어'?player.seconds:null});
 records=records.slice(0,100);saveRecords();
}
function line(parent,txt){const p=document.createElement('p');p.textContent=txt;parent.append(p);return p}
function field(label,value,max){
 const wrapper=document.createElement('label');wrapper.textContent=label;
 const input=document.createElement('input');input.value=value;input.maxLength=max;input.style.cssText='display:block;width:100%;padding:9px;border-radius:6px;margin:5px 0 10px';wrapper.append(input);panel.append(wrapper);return input
}
function endpoint(){return document.querySelector('meta[name="ranking-endpoint"]')?.content||''}
function ranking(back,run){
 screen('records','<h2>랭킹 기록실</h2><p>친구를 비방하는 말이나 비속어는 삭제될 수 있습니다.</p>');
 const url=endpoint(), record=records.find(r=>r.id===run);
 if(record&&record.kills>0&&url&&!record.sent){
  const nick=field('온라인에 표시할 별명',record.name,12),status=line(panel,'별명과 이번 잠수 기록이 공개됩니다.');
  const send=button('이번 기록 등록',async()=>{
   const name=nick.value.trim();
   if(!/^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9 ]{1,12}$/.test(name)){status.textContent='별명은 한글, 영문, 숫자로 1~12자를 입력하세요.';return}
   send.disabled=true;status.textContent='등록 중…';
   try{
    const info=await fetch(url+'?schema='+Date.now(),{signal:AbortSignal.timeout(20000)});
    if((await info.json()).schema!==2){status.textContent='랭킹 서버 업데이트가 필요합니다. 선생님께 알려 주세요.';send.disabled=false;return}
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...record,name}),signal:AbortSignal.timeout(25000)});
    if(!res.ok||!(await res.json()).ok)throw Error();
    record.sent=true;record.name=name;saveRecords();if(status.isConnected)ranking(back,run);
   }catch{status.textContent='등록을 확인할 수 없습니다. 연결을 확인한 뒤 다시 시도하세요.';send.disabled=false}
  },true)
 }
 if(record?.sent)line(panel,'온라인 등록 완료');
 const board=document.createElement('section');
 let revision=0;
 function show(rows,online){
  board.replaceChildren();const title=document.createElement('h3');title.textContent=online?'온라인 순위 · 상위 50개 기록':'이 기기 · 최근 잠수 기록';board.append(title);
  if(!rows.length){line(board,'첫 잠수 기록을 남겨 보세요.');return}
  const list=document.createElement('ol');board.append(list);
  for(const row of rows){const li=document.createElement('li');li.textContent=(online?row.name:new Date(row.date).toLocaleDateString('ko-KR'))+'　'+Number(row.score).toLocaleString()+'점 · S'+row.stage+' · '+row.kills+'마리'+(row.result?' · '+row.result:'')+(row.result==='클리어'&&row.seconds?' '+duration(row.seconds):'');list.append(li)}
 }
 async function online(){
  const version=++revision;board.textContent='온라인 기록을 불러오는 중…';
  try{const res=await fetch(url+'?t='+Date.now(),{signal:AbortSignal.timeout(20000)}),data=await res.json();
   if(!res.ok||!data.ok||!Array.isArray(data.rows))throw Error();if(version===revision)show(data.rows,true)
  }catch{if(version===revision)board.textContent='온라인 기록을 불러오지 못했습니다. 온라인 순위를 눌러 다시 시도하세요.'}
 }
 if(url)button('온라인 순위',online);
 button('이 기기 기록',()=>{revision++;show(records,false)});button('돌아가기',back);
 panel.append(board);if(url)online();else show(records,false)
}
let prev=0;
function frame(ms){const dt=Math.min(.05,Math.max(0,(ms-prev)/1000));prev=ms;if(mode==='play')step(dt);render(mode==='intro'?ms/1000:clock);requestAnimationFrame(frame)}
resize();fresh();intro();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(frame);
</script></html>
